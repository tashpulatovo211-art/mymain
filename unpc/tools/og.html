<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>Link preview image</title>
<!-- The link preview image, assets/og.png (1200 by 630), is a screenshot of this page. The site does not load it.
     To make the image again: serve the site folder, open tools/og.html at 1200 by 630 with a device pixel ratio of 1, the
     light theme and the web fonts loaded, and save a screenshot of the window as assets/og.png. Keep it under 200 KB. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..500&amp;display=swap">
<link rel="stylesheet" href="../assets/style.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; scrollbar-gutter: auto; }
  body { display: grid; justify-items: center; align-content: start; min-height: 0; background: var(--ground); }
  .og-fig { width: 600px; height: 300px; margin-top: 64px; }
  .og-title {
    margin-top: 36px;
    font: 360 64px/1.04 var(--serif);
    letter-spacing: var(--tr-hero);
    font-optical-sizing: auto;
    color: var(--ink);
    text-align: center;
  }
  .og-title span { display: block; }
</style>
<script src="../assets/chamber.js" defer></script>
</head>
<body>
<canvas class="og-fig" aria-hidden="true"></canvas>
<h1 class="og-title"><span>Students write policy.</span> <span>The best goes to parliament.</span></h1>
<script>
  // The hero's 520 seats, drawn complete (no intro), once the fonts are in.
  window.addEventListener("load", function () {
    document.fonts.ready.then(function () {
      var C = window.UNPCChamber;
      C.drawChamber(document.querySelector(".og-fig"), { n: C.N, q: C.Q, pad: 2 });
      document.documentElement.setAttribute("data-ready", "");
    });
  });
</script>
</body>
</html>
